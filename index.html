        image: "https://images.unsplash.com/photo-1503676260728-1c00da094a0b?w=400&h=250&fit=crop",
        content: `<h2>Introduction</h2><p>Do you freeze when you must choose between <em>I work</em> and <em>I’m working</em>? You are not alone. The present tense is not just about “now.” It is a tool for facts, habits, current actions, and unfinished stories.</p><p>In this article, you will see how native speakers use present tenses in real interviews, news headlines, songs, and everyday speech. No boring rules. Just real English in action.</p><h2>1. Present Simple: The Truth Machine</h2><h3>What it does</h3><p>The present simple is your everyday workhorse. You use it for permanent facts, routines, opinions, and news headlines.</p><h3>From the newsroom</h3><blockquote>“President signs new climate bill.” — <strong>BBC News</strong></blockquote><p>Newspapers often use the present simple for past events. This “historical present” makes news feel immediate.</p><blockquote>“The average office worker spends more than six hours a day online.” — <strong>The Times</strong></blockquote><p>General fact, not temporary action.</p><h3>Real voices</h3><p><strong>Emma Watson (UN Speech):</strong> “I don’t want other people to decide who I am.”</p><p><strong>J.K. Rowling (The Times):</strong> “I write because I love it.”</p><p><strong>Tom Hanks (The Guardian):</strong> “I always feel that I’m a student of human behaviour.”</p><p><strong>Signal words:</strong> always, usually, often, sometimes, never, every day, generally.</p><h2>2. Present Continuous: The Action Camera</h2><h3>What it does</h3><p>Captures actions happening now, temporary situations, and current trends.</p><h3>From the newsroom</h3><blockquote>“We are seeing a sharp increase in remote jobs.” — <strong>CNN</strong></blockquote><blockquote>“Young professionals are moving away from traditional nine-to-five jobs.” — <strong>The Guardian</strong></blockquote><h3>Real voices</h3><p><strong>Billie Eilish (Vogue):</strong> “I’m just trying to figure out who I am.”</p><p><strong>Tom Holland (BBC Radio 1):</strong> “Right now, I’m focusing on my family and my mental health.”</p><p><strong>Harry Styles (Rolling Stone):</strong> “I’m learning to be more present in my life.”</p><p><strong>Signal words:</strong> now, right now, at the moment, currently, these days, today.</p><h2>3. Present Perfect: The Bridge Between Past and Present</h2><h3>What it does</h3><p>Connects the past to the present: experiences, recent news, results now.</p><h3>From the newsroom</h3><blockquote>“Scientists have discovered a new deep-sea creature that challenges what researchers thought they knew about ocean life.” — <strong>The New York Times</strong></blockquote><blockquote>“The company has announced a major restructuring plan.” — <strong>The Economist</strong></blockquote><h3>Real voices</h3><p><strong>Michelle Obama (Memoir):</strong> “I have learned that my voice has value.”</p><p><strong>Serena Williams (NYT):</strong> “I’ve always believed that I could be number one.”</p><p><strong>Signal words:</strong> ever, never, just, already, yet, recently, so far, today, this week.</p><h2>4. Present Perfect Continuous: The Long-Running Story</h2><h3>What it does</h3><p>Emphasises duration of actions that started in the past and continue now.</p><h3>From the newsroom</h3><blockquote>“Residents have been complaining about the noise for months.” — <strong>BBC News</strong></blockquote><blockquote>“The company has been struggling since the pandemic.” — <strong>The Economist</strong></blockquote><h3>Real voices</h3><p><strong>Adele (The Guardian):</strong> “I’ve been trying to find myself again.”</p><p><strong>David Attenborough (BBC):</strong> “We have been changing the natural world for thousands of years.”</p><p><strong>Zendaya (Vogue):</strong> “I’ve been working since I was 14, so I’ve been figuring out who I am outside of that.”</p><p><strong>Signal words:</strong> for, since, all day, all week, for ages, recently, lately.</p><h2>🧩 Idioms in Action</h2><table><tr><th>Idiom</th><th>Meaning</th><th>Real context</th></tr><tr><td>Hit the ground running</td><td>Start with energy</td><td>CNN Business</td></tr><tr><td>Break the ice</td><td>Relax people</td><td>The Times</td></tr><tr><td>Be in the same boat</td><td>Share a problem</td><td>BBC News</td></tr><tr><td>Spill the beans</td><td>Reveal a secret</td><td>Vogue</td></tr><tr><td>See eye to eye</td><td>Agree</td><td>CNN</td></tr><tr><td>The ball is in your court</td><td>Your turn to act</td><td>The Guardian</td></tr></table><h2>📌 Takeaway / Mémo</h2><table><tr><th>Tense</th><th>Use</th><th>Real example</th><th>Signal words</th></tr><tr><td>Present Simple</td><td>Facts, habits</td><td>“The average office worker spends…” — The Times</td><td>always, usually</td></tr><tr><td>Present Continuous</td><td>Actions now</td><td>“We are seeing…” — CNN</td><td>now, currently</td></tr><tr><td>Present Perfect</td><td>Past experience, result now</td><td>“Scientists have discovered…” — NYT</td><td>ever, just, yet</td></tr><tr><td>Present Perfect Continuous</td><td>Duration</td><td>“Residents have been complaining…” — BBC</td><td>for, since</td></tr></table><h2>💬 What about you?</h2><p>Which present tense do you find most difficult? Share your answer in the comments below!</p>`

        image: "https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=400&h=250&fit=crop",
        content: `<h2>Introduction</h2><p>Past tenses do more than talk about yesterday. They help you tell stories, describe past situations, and explain what happened before something else.</p><h2>1. Past Simple: The Finished Action</h2><h3>From the newsroom</h3><blockquote>“Protesters marched through the city centre yesterday.” — <strong>CNN</strong></blockquote><blockquote>“The committee published its final report last week.” — <strong>The Times</strong></blockquote><h3>Real voices</h3><p><strong>Tom Hanks (BBC):</strong> “I worked as a waiter before I became an actor.”</p><p><strong>Emma Stone (Vogue):</strong> “I moved to Los Angeles when I was fifteen.”</p><p><strong>Signal words:</strong> yesterday, last week, ago, in 2019, when.</p><h2>2. Past Continuous: The Background Action</h2><h3>From the newsroom</h3><blockquote>“At 10 pm, residents were sleeping when the earthquake struck.” — <strong>BBC News</strong></blockquote><blockquote>“The company was losing money before the new CEO arrived.” — <strong>The Economist</strong></blockquote><h3>Real voices</h3><p><strong>Jennifer Lawrence (Vogue):</strong> “I was waiting for the bus when a stranger recognised me.”</p><p><strong>Signal words:</strong> while, when, at that moment, as.</p><h2>3. Past Perfect: The Earlier Past</h2><h3>From the newsroom</h3><blockquote>“The company had announced layoffs before the CEO resigned.” — <strong>The New York Times</strong></blockquote><blockquote>“Officials said the storm had caused widespread damage.” — <strong>CNN</strong></blockquote><h3>Real voices</h3><p><strong>Taylor Swift (The Times):</strong> “I had already written the song before the relationship ended.”</p><p><strong>Signal words:</strong> already, just, before, after, by the time.</p><h2>4. Past Perfect Continuous: The Long Past Action</h2><h3>From the newsroom</h3><blockquote>“Workers had been negotiating for months before the strike.” — <strong>The Economist</strong></blockquote><blockquote>“Residents had been complaining about the noise for years before the city took action.” — <strong>The Guardian</strong></blockquote><h3>Real voices</h3><p><strong>Christopher Nolan (BBC):</strong> “I had been thinking about this story for ten years before I started filming.”</p><p><strong>Signal words:</strong> for, since, before, by the time.</p><h2>🧩 Idioms in Action</h2><table><tr><th>Idiom</th><th>Meaning</th><th>Example</th></tr><tr><td>Water under the bridge</td><td>Past problem no longer matters</td><td>“The argument is water under the bridge now.”</td></tr><tr><td>Turn back time</td><td>Wish to return to the past</td><td>“He wants to turn back time and change his decision.”</td></tr><tr><td>Live in the past</td><td>Focus too much on past events</td><td>“Don’t live in the past; think about the future.”</td></tr></table><h2>📌 Takeaway / Mémo</h2><table><tr><th>Tense</th><th>Use</th><th>Real example</th><th>Signal words</th></tr><tr><td>Past Simple</td><td>Completed action</td><td>“I worked as a waiter.” — Tom Hanks</td><td>yesterday, ago, last</td></tr><tr><td>Past Continuous</td><td>Action in progress</td><td>“I was waiting for the bus.” — Jennifer Lawrence</td><td>while, when</td></tr><tr><td>Past Perfect</td><td>Earlier past</td><td>“I had already written the song.” — Taylor Swift</td><td>already, before</td></tr><tr><td>Past Perfect Continuous</td><td>Duration before past event</td><td>“I had been thinking…” — Christopher Nolan</td><td>for, since</td></tr></table><h2>💬 What about you?</h2><p>Which past tense do you use most often? Let me know in the comments!</p>`
      },
      {
        id: 3,
        title: "Future Tenses: From Hollywood Plans to BBC Predictions",
        category: "grammar",
        excerpt: "Will, going to, present continuous for future, and future perfect/continuous with real quotes from Greta Thunberg, Zendaya, and Harry Styles.",
        image: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=400&h=250&fit=crop",
        content: `<h2>Introduction</h2><p>Talking about the future is not just about <em>will</em>. Native speakers use different structures to show intention, prediction, and fixed plans.</p><h2>1. Will: Predictions and Promises</h2><h3>From the newsroom</h3><blockquote>“Experts predict that artificial intelligence will change the job market.” — <strong>CNN</strong></blockquote><blockquote>“The government will introduce new measures next month.” — <strong>The Times</strong></blockquote><h3>Real voices</h3><p><strong>Greta Thunberg (BBC speech):</strong> “We will not stop fighting.”</p><p><strong>Signal words:</strong> tomorrow, next year, soon, probably, I think.</p><h2>2. Going to: Plans and Intentions</h2><h3>From the newsroom</h3><blockquote>“The government is going to raise taxes next year.” — <strong>The Times</strong></blockquote><blockquote>“Tech giants are going to invest heavily in AI research.” — <strong>The Economist</strong></blockquote><h3>Real voices</h3><p><strong>Zendaya (Vogue):</strong> “I’m going to take a break after this film.”</p><p><strong>Signal words:</strong> going to, plan to, intend to.</p><h2>3. Present Continuous for Fixed Arrangements</h2><h3>From the newsroom</h3><blockquote>“The president is meeting European leaders tomorrow.” — <strong>BBC News</strong></blockquote><blockquote>“The team is launching the new product next Monday.” — <strong>CNN Business</strong></blockquote><h3>Real voices</h3><p><strong>Harry Styles (BBC Radio 1):</strong> “I’m starting my world tour in June.”</p><p><strong>Signal words:</strong> tomorrow, this weekend, next Monday, at 5 pm.</p><h2>4. Future Continuous and Future Perfect</h2><p><strong>Future continuous</strong> (<em>will be + -ing</em>): action in progress at a future time.</p><blockquote>“By 2030, most cars will be running on electricity.” — <strong>The Economist</strong></blockquote><p><strong>Future perfect</strong> (<em>will have + past participle</em>): action completed before a future time.</p><blockquote>“By the end of the year, the company will have hired 500 new employees.” — <strong>CNN</strong></blockquote><h2>🧩 Idioms in Action</h2><table><tr><th>Idiom</th><th>Meaning</th><th>Example</th></tr><tr><td>Ahead of the curve</td><td>More advanced</td><td>“This startup is ahead of the curve.”</td></tr><tr><td>In the pipeline</td><td>Planned</td><td>“A new album is in the pipeline.”</td></tr><tr><td>Down the road</td><td>In the future</td><td>“Down the road, you will understand.”</td></tr></table><h2>📌 Takeaway / Mémo</h2><table><tr><th>Structure</th><th>Use</th><th>Real example</th><th>Signal words</th></tr><tr><td>Will</td><td>Predictions, promises</td><td>“We will not stop fighting.” — Greta Thunberg</td><td>tomorrow, soon, probably</td></tr><tr><td>Going to</td><td>Plans</td><td>“I’m going to take a break.” — Zendaya</td><td>going to, plan to</td></tr><tr><td>Present continuous</td><td>Fixed arrangements</td><td>“I’m starting my world tour in June.” — Harry Styles</td><td>tomorrow, this weekend</td></tr><tr><td>Future continuous / perfect</td><td>Action in progress / completed before future time</td><td>“Most cars will be running on electricity.” — The Economist</td><td>by 2030, by the end</td></tr></table><h2>💬 What about you?</h2><p>What are you going to do this weekend? Write your answer using future tenses!</p>`

      {
        id: 4,
        title: "Active vs Passive: What News Headlines and Scientific Reports Teach You",
        category: "grammar",
        excerpt: "Active and passive voices in real news from BBC, CNN, and The New York Times, with idioms used by journalists.",
        image: "https://images.unsplash.com/photo-1495020689067-958852a7765e?w=400&h=250&fit=crop",
        content: `<h2>Introduction</h2><p>Active voice puts the subject first. Passive voice puts the action or result first. Both are essential, especially in news and academic writing.</p><h2>1. Active Voice: The Doer First</h2><h3>From the newsroom</h3><blockquote>“Scientists discover new coral reef.” — <strong>BBC News</strong></blockquote><p>The subject (scientists) performs the action.</p><h3>Real voices</h3><p><strong>Stephen King:</strong> “I write every day.”</p><h2>2. Passive Voice: The Action First</h2><h3>From the newsroom</h3><blockquote>“A new coral reef was discovered by scientists.” — <strong>CNN</strong></blockquote><blockquote>“The bill was passed by the Senate.” — <strong>The New York Times</strong></blockquote><p>Focus is on the action or result.</p><h2>3. When to Use Passive Voice</h2><p>Use passive voice in news reports, scientific writing, or when the doer is unknown.</p><blockquote>“My phone was stolen.” (Unknown doer)</blockquote><h2>🧩 Idioms in Action</h2><table><tr><th>Idiom</th><th>Meaning</th><th>Example</th></tr><tr><td>Be in the driver’s seat</td><td>Be in control</td><td>“She is in the driver’s seat of this project.”</td></tr><tr><td>Pass the buck</td><td>Blame someone else</td><td>“Don’t pass the buck; take responsibility.”</td></tr><tr><td>Be taken for a ride</td><td>Be tricked</td><td>“He was taken for a ride by that fake deal.”</td></tr></table><h2>📌 Takeaway / Mémo</h2><table><tr><th>Voice</th><th>Use</th><th>Example</th></tr><tr><td>Active</td><td>Subject performs action</td><td>“Scientists discover new coral reef.” — BBC</td></tr><tr><td>Passive</td><td>Action or receiver is focus</td><td>“A new coral reef was discovered.” — CNN</td></tr><tr><td>Passive with agent</td><td>Doer included with by</td><td>“The bill was passed by the Senate.” — NYT</td></tr></table><h2>💬 What about you?</h2><p>Can you write a passive sentence about something that happened recently?</p>`
      },
      {
        id: 5,
        title: "Direct and Indirect Speech: How Journalists Report What Stars Say",
        category: "grammar",
        excerpt: "Learn to report speech with quotes from Angelina Jolie and examples from The Times and CNN.",
        image: "https://images.unsplash.com/photo-1524250502761-1ac6f2e30d43?w=400&h=250&fit=crop",
        content: `<h2>Introduction</h2><p>When you report what someone said, you can quote them directly or report it indirectly. Both are common in news and interviews.</p><h2>1. Direct Speech: Exact Words</h2><p>Use quotation marks and the speaker’s exact words.</p><blockquote>“I want to be a voice for the voiceless.” — <strong>Angelina Jolie (BBC interview)</strong></blockquote><h2>2. Indirect Speech: Reported Words</h2><p>Indirect speech changes pronouns and verb tenses.</p><blockquote>Angelina Jolie said that she wanted to be a voice for the voiceless. — <strong>CNN report</strong></blockquote><h2>3. Tense Changes</h2><table><tr><th>Direct</th><th>Indirect</th></tr><tr><td>“I work hard.”</td><td>She said she worked hard.</td></tr><tr><td>“I am working.”</td><td>He said he was working.</td></tr><tr><td>“I have finished.”</td><td>She said she had finished.</td></tr><tr><td>“I will call.”</td><td>He said he would call.</td></tr></table><h2>4. Reporting Verbs</h2><p>Use <em>say, tell, explain, admit, promise, warn, claim</em>.</p><blockquote>“The minister warned that prices would rise.” — <strong>The Times</strong></blockquote><h2>🧩 Idioms in Action</h2><table><tr><th>Idiom</th><th>Meaning</th><th>Example</th></tr><tr><td>Put words in someone’s mouth</td><td>Claim someone said something they didn’t</td><td>“Don’t put words in my mouth.”</td></tr><tr><td>Word for word</td><td>Exactly as said</td><td>“She repeated the speech word for word.”</td></tr><tr><td>Read between the lines</td><td>Understand hidden meaning</td><td>“You can read between the lines.”</td></tr></table><h2>📌 Takeaway / Mémo</h2><table><tr><th>Feature</th><th>Direct</th><th>Indirect</th></tr><tr><td>Quotation marks</td><td>Yes</td><td>No</td></tr><tr><td>Pronoun change</td><td>No</td><td>Yes (I → he/she)</td></tr><tr><td>Tense shift</td><td>No</td><td>Often backshift</td></tr><tr><td>Example</td><td>“I want to be a voice.” — Angelina Jolie</td><td>She said she wanted to be a voice.</td></tr></table><h2>💬 What about you?</h2><p>What did someone tell you recently? Report it in indirect speech!</p>`

      {
        id: 6,
        title: "Simple to Complex: Building Powerful Sentences Like a Native Writer",
        category: "grammar",
        excerpt: "Mix simple, compound, and complex sentences with real quotes from Hemingway, Maya Angelou, and Chimamanda Ngozi Adichie.",
        image: "https://images.unsplash.com/photo-1519681393784-d120267933ba?w=400&h=250&fit=crop",
        content: `<h2>Introduction</h2><p>Great writing mixes simple, compound, and complex sentences. This rhythm keeps readers interested.</p><h2>1. Simple Sentences</h2><p>One independent clause. Short and clear.</p><blockquote>“The world is a fine place.” — <strong>Ernest Hemingway</strong></blockquote><h2>2. Compound Sentences</h2><p>Two independent clauses joined by <em>and, but, or, so</em>.</p><blockquote>“I’ve learned that people will forget what you said, but they will never forget how you made them feel.” — <strong>Maya Angelou</strong></blockquote><h2>3. Complex Sentences</h2><p>Independent clause + at least one dependent clause.</p><blockquote>“When we reject the single story, we regain a kind of paradise.” — <strong>Chimamanda Ngozi Adichie</strong></blockquote><h2>🧩 Idioms in Action</h2><table><tr><th>Idiom</th><th>Meaning</th><th>Example</th></tr><tr><td>Keep it short and sweet</td><td>Be brief and clear</td><td>“In emails, keep it short and sweet.”</td></tr><tr><td>Beat around the bush</td><td>Avoid saying what you mean</td><td>“Stop beating around the bush.”</td></tr><tr><td>Get to the point</td><td>Speak directly</td><td>“Please get to the point.”</td></tr></table><h2>📌 Takeaway / Mémo</h2><table><tr><th>Sentence Type</th><th>Structure</th><th>Example</th></tr><tr><td>Simple</td><td>One independent clause</td><td>“The world is a fine place.” — Hemingway</td></tr><tr><td>Compound</td><td>Two independent clauses + conjunction</td><td>Maya Angelou quote</td></tr><tr><td>Complex</td><td>Independent + dependent clause</td><td>Chimamanda quote</td></tr></table><h2>💬 What about you?</h2><p>Write one complex sentence about your favourite book or movie!</p>`

      {
        id: 7,
        title: "W/H Words: The Questions Journalists and Interviewers Ask",
        category: "grammar",
        excerpt: "Master who, what, when, where, why, how with real interview questions from BBC and CNN.",
        image: "https://images.unsplash.com/photo-1521791136064-7986c2920216?w=400&h=250&fit=crop",
        content: `<h2>Introduction</h2><p>W/H words — <em>who, what, when, where, why, how</em> — are the backbone of every interview and news report.</p><h2>1. The Basic W/H Words</h2><ul><li><strong>Who</strong> – person: “Who said that?”</li><li><strong>What</strong> – thing/action: “What happened?”</li><li><strong>When</strong> – time: “When did the meeting start?”</li><li><strong>Where</strong> – place: “Where is the conference?”</li><li><strong>Why</strong> – reason: “Why did she leave?”</li><li><strong>How</strong> – manner/degree: “How did you learn English?”</li></ul><h2>2. W/H Words in Real Interviews</h2><blockquote>“What inspired you to become an actor?” — <strong>BBC interview question</strong></blockquote><blockquote>“How will the new policy affect small businesses?” — <strong>CNN journalist</strong></blockquote><h2>3. Indirect Questions</h2><p>More polite, word order changes.</p><blockquote>Direct: “Where is the station?”<br>Indirect: “Could you tell me where the station is?”</blockquote><h2>4. W/H Words as Connectors</h2><blockquote>“The reason why he resigned is still unclear.” — <strong>BBC News</strong></blockquote><h2>🧩 Idioms in Action</h2><table><tr><th>Idiom</th><th>Meaning</th><th>Example</th></tr><tr><td>The five Ws</td><td>Basic facts</td><td>“A good news story answers the five Ws.”</td></tr><tr><td>Out of the question</td><td>Impossible</td><td>“Working from home is out of the question.”</td></tr><tr><td>Beg the question</td><td>Raise a question</td><td>“His silence begs the question.”</td></tr></table><h2>📌 Takeaway / Mémo</h2><table><tr><th>W/H Word</th><th>Function</th><th>Real example</th></tr><tr><td>Who</td><td>Person</td><td>“Who said that?”</td></tr><tr><td>What</td><td>Thing/action</td><td>“What inspired you?” — BBC</td></tr><tr><td>When</td><td>Time</td><td>“When did it happen?”</td></tr><tr><td>Where</td><td>Place</td><td>“Where is the office?”</td></tr><tr><td>Why</td><td>Reason</td><td>“Why did she leave?”</td></tr><tr><td>How</td><td>Manner/degree</td><td>“How will the policy affect businesses?” — CNN</td></tr></table><h2>💬 What about you?</h2><p>What is your biggest question about English? Ask it using a W/H word!</p>`

      {
        id: 8,
        title: "Relative Pronouns: Who, Which, That and How to Use Them Like a Pro",
        category: "grammar",
        excerpt: "Connect ideas with who, whom, whose, which, that, where, and when — with real examples from The Times and CNN.",
        image: "https://images.unsplash.com/photo-1516414447565-b14be0adf13e?w=400&h=250&fit=crop",
        content: `<h2>Introduction</h2><p>Relative pronouns connect ideas and describe people, things, places, and times. They make your English sound more fluent.</p><h2>1. Who, Whom, Whose – People</h2><ul><li><strong>Who</strong> – subject: “The actress who starred in the film is here.”</li><li><strong>Whom</strong> – object (formal): “The director whom I met was very kind.”</li><li><strong>Whose</strong> – possession: “The writer whose book became a bestseller is giving a talk.”</li></ul><blockquote>“The singer who won the award thanked her fans.” — <strong>BBC interview</strong></blockquote><h2>2. Which, That – Things</h2><p><strong>Which</strong> – things, often in non-defining clauses.</p><blockquote>“The report, which was published yesterday, shows growth.” — <strong>The Times</strong></blockquote><p><strong>That</strong> – things or people in defining clauses.</p><blockquote>“The policy that the government introduced is controversial.” — <strong>CNN</strong></blockquote><h2>3. Where, When – Place and Time</h2><p>“This is the studio where we filmed.”<br>“I remember the day when we first met.”</p><h2>4. Defining vs Non-Defining Clauses</h2><p><strong>Defining</strong> – essential information, no commas.</p><p>“The book that I read was excellent.”</p><p><strong>Non-defining</strong> – extra information, with commas.</p><p>“The book, which I bought last week, was excellent.”</p><h2>🧩 Idioms in Action</h2><table><tr><th>Idiom</th><th>Meaning</th><th>Example</th></tr><tr><td>The one who</td><td>The person who does something</td><td>“She is the one who always helps.”</td></tr><tr><td>Which is which</td><td>Tell two similar things apart</td><td>“They look alike; I can’t tell which is which.”</td></tr><tr><td>A matter of which</td><td>A question of choice</td><td>“It’s just a matter of which colour you prefer.”</td></tr></table><h2>📌 Takeaway / Mémo</h2><table><tr><th>Pronoun</th><th>Use</th><th>Example</th></tr><tr><td>Who</td><td>People (subject)</td><td>“The actress who starred…”</td></tr><tr><td>Whom</td><td>People (object)</td><td>“The director whom I met…”</td></tr><tr><td>Whose</td><td>Possession</td><td>“The writer whose book…”</td></tr><tr><td>Which</td><td>Things (non-defining)</td><td>“The report, which was published…” — The Times</td></tr><tr><td>That</td><td>Things/people (defining)</td><td>“The policy that the government introduced…” — CNN</td></tr><tr><td>Where / When</td><td>Place / time</td><td>“This is the studio where we filmed.”</td></tr></table><h2>💬 What about you?</h2><p>Describe a person who inspires you using a relative pronoun!</p>`

      {
        id: 9,
        title: "Word Formation: How Prefixes and Suffixes Build Your Vocabulary",
        category: "vocabulary",
        excerpt: "Learn common prefixes and suffixes with real examples from BBC and The New York Times, plus idioms using word formation.",
        image: "https://images.unsplash.com/photo-1455390582262-044cdead277a?w=400&h=250&fit=crop",
        content: `<h2>Introduction</h2><p>One root word can become many words. Prefixes and suffixes change meaning and word class. This skill expands your vocabulary fast.</p><h2>1. Common Prefixes</h2><ul><li><strong>un-</strong> (not) → unhappy, unclear</li><li><strong>re-</strong> (again) → rewrite, rebuild</li><li><strong>dis-</strong> (opposite) → disagree, disappear</li><li><strong>pre-</strong> (before) → preview, predict</li><li><strong>over-</strong> (too much) → overload, overwork</li></ul><blockquote>“The government promised to rebuild the damaged areas.” — <strong>BBC News</strong></blockquote><h2>2. Common Suffixes</h2><ul><li><strong>-tion / -sion</strong> (noun) → education, decision</li><li><strong>-able / -ible</strong> (adjective) → comfortable, visible</li><li><strong>-ful</strong> (full of) → helpful, careful</li><li><strong>-less</strong> (without) → homeless, careless</li><li><strong>-er / -or</strong> (person/thing) → teacher, actor</li></ul><blockquote>“The new policy is more accessible to young people.” — <strong>The New York Times</strong></blockquote><h2>3. Word Families</h2><table><tr><th>Root</th><th>Noun</th><th>Adjective</th><th>Verb</th></tr><tr><td>create</td><td>creation</td><td>creative</td><td>create</td></tr><tr><td>decide</td><td>decision</td><td>decisive</td><td>decide</td></tr><tr><td>care</td><td>care</td><td>careful/careless</td><td>care</td></tr></table><h2>🧩 Idioms in Action</h2><table><tr><th>Idiom</th><th>Meaning</th><th>Example</th></tr><tr><td>Make or break</td><td>The thing that decides success or failure</td><td>“This exam is make or break.”</td></tr><tr><td>In other words</td><td>Say it differently</td><td>“In other words, we need to start again.”</td></tr><tr><td>A word in edgeways</td><td>Get a chance to speak</td><td>“She talks so much I can’t get a word in edgeways.”</td></tr></table><h2>📌 Takeaway / Mémo</h2><table><tr><th>Affix</th><th>Meaning</th><th>Example</th></tr><tr><td>un-</td><td>not</td><td>unhappy</td></tr><tr><td>re-</td><td>again</td><td>rebuild — BBC</td></tr><tr><td>dis-</td><td>opposite</td><td>disagree</td></tr><tr><td>-tion</td><td>noun</td><td>decision</td></tr><tr><td>-able</td><td>adjective</td><td>accessible — NYT</td></tr><tr><td>-ful</td><td>full of</td><td>helpful</td></tr><tr><td>-less</td><td>without</td><td>homeless</td></tr></table><h2>💬 What about you?</h2><p>Can you create a new word using a prefix or suffix? Share it below!</p>`

      {
        id: 10,
        title: "Adjectives: Describe the World Like a Native Speaker",
        category: "vocabulary",
        excerpt: "All types of adjectives with real examples from celebrities and media, plus idioms that use adjectives.",

        content: `<h2>Introduction</h2><p>Adjectives add colour and precision to your English. Learn the different types and see how native speakers use them in interviews and news.</p><h2>1. Descriptive Adjectives</h2><p>Describe qualities: <em>beautiful, intelligent, challenging</em>.</p><blockquote>“She is an incredibly talented actress.” — <strong>Vogue interview</strong></blockquote><h2>2. Quantitative Adjectives</h2><p>Describe quantity: <em>some, many, few, all</em>.</p><blockquote>“Many young people are choosing freelance careers.” — <strong>The Guardian</strong></blockquote><h2>3. Demonstrative Adjectives</h2><p>Point out specific items: <em>this, that, these, those</em>.</p><blockquote>“This policy will affect everyone.” — <strong>BBC News</strong></blockquote><h2>4. Possessive Adjectives</h2><p>Show ownership: <em>my, your, his, her, our, their</em>.</p><blockquote>“My voice has value.” — <strong>Michelle Obama</strong></blockquote><h2>5. Comparative and Superlative Adjectives</h2><p>Compare things: <em>better, worse, the best, the most</em>.</p><blockquote>“This is the most important election of our lifetime.” — <strong>CNN anchor</strong></blockquote><h2>🧩 Idioms in Action</h2><table><tr><th>Idiom</th><th>Meaning</th><th>Example</th></tr><tr><td>As cool as a cucumber</td><td>Very calm</td><td>“She stayed as cool as a cucumber during the interview.”</td></tr><tr><td>A tough nut to crack</td><td>Hard to understand or solve</td><td>“This math problem is a tough nut to crack.”</td></tr><tr><td>Out of this world</td><td>Amazing, excellent</td><td>“The concert was out of this world.”</td></tr></table><h2>📌 Takeaway / Mémo</h2><table><tr><th>Type</th><th>Function</th><th>Example</th></tr><tr><td>Descriptive</td><td>Quality</td><td>talented</td></tr><tr><td>Quantitative</td><td>Quantity</td><td>many</td></tr><tr><td>Demonstrative</td><td>Specific items</td><td>this</td></tr><tr><td>Possessive</td><td>Ownership</td><td>my</td></tr><tr><td>Comparative/Superlative       mainContent.innerHTML = `<div class="lab-view"><span class="back-link" id="back-to-home">← Back to all posts</span>${travelContent}</div>`;
      document.getElementById('back-to-home').addEventListener('click', renderHome);
      window.scrollTo(0, 0);
    }

    function renderWriting() {
      currentView = 'writing';
      mainContent.innerHTML = `<div class="lab-view"><span class="back-link" id="back-to-home">← Back to all posts</span>${writingContent}</div>`;
      document.getElementById('back-to-home').addEventListener('click', renderHome);
      window.scrollTo(0, 0);
    }

    function renderQuiz() {
      currentView = 'quiz';
      mainContent.innerHTML = `<div class="lab-view"><span class="back-link" id="back-to-home">← Back to all posts</span>${quizContent}</div>`;
      document.getElementById('back-to-home').addEventListener('click', renderHome);
      window.scrollTo(0, 0);
    }

    function renderMore() {
      currentView = 'more';
      mainContent.innerHTML = `<div class="lab-view"><span class="back-link" id="back-to-home">← Back to all posts</span>${moreContent}</div>`;
      document.getElementById('back-to-home').addEventListener('click', renderHome);
      window.scrollTo(0, 0);
    }

    const themeToggle = document.getElementById('theme-toggle');
    const savedTheme = localStorage.getItem('blog-theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
      themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
    }
    themeToggle.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('blog-theme', newTheme);
      themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
    });

    navButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = btn.dataset.category;
        if (cat === 'pro-lab') { renderProLab(); return; }
        if (cat === 'ielts') { renderIelts(); return; }
        if (cat === 'business') { renderBusiness(); return; }
        if (cat === 'travel') { renderTravel(); return; }
        if (cat === 'writing') { renderWriting(); return; }
        if (cat === 'quiz') { renderQuiz(); return; }
        if (cat === 'more') { renderMore(); return; }
        currentCategory = cat;
        setActiveNav();
        currentView = 'home';
        renderHome();
      });
    });

    searchInput.addEventListener('input', (e) => {
      searchTerm = e.target.value;
      renderHome();
    });

    window.addEventListener('scroll', () => {
      if (window.scrollY > 300) {
        backToTopBtn.style.display = 'block';
      } else {
        backToTopBtn.style.display = 'none';
      }
    });

    backToTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    renderSidebar();
    renderHome();
  </script>
</body>
</html>
